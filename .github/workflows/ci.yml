name: CI Build & Test

on:
  push:
    branches: [main, mielon-parity]
  pull_request: {}

jobs:
  build:
    name: Build & Test (Java 25, Gradle 9.7.1)
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Check terrain datapack references
        run: python3 scripts/check_terrain_refs.py

      - name: Build with Gradle
        run: ./gradlew --no-daemon clean build

      - name: Verify Paper 26.3 datapack boot
        env:
          MINECRAFT_EULA_ACCEPTED: ${{ vars.MINECRAFT_EULA_ACCEPTED }}
        run: bash scripts/verify-paper-boot.sh

      - name: Publish test results
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results
          path: build/reports/tests/
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: TheSift-foundation.jar
          path: build/libs/TheSift-foundation-*.jar
          retention-days: 7

      - name: Upload Paper boot logs
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: paper-26.3-boot-logs
          path: |
            build/paper-boot-console.log
            run/paper-26.3/logs/latest.log
          if-no-files-found: ignore
          retention-days: 7
