name: "CI Build & Test"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    name: "Pipeline (Java 25, Gradle 9.7.1)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: "🧳 Checkout Code"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "🔍 Pre-check: Terrain Datapack References"
        run: |
          if [ -f scripts/check_terrain_refs.py ]; then
            python3 scripts/check_terrain_refs.py
          else
            echo "::warning:: Verification script not found, skipping."
          fi

      - name: "☕ Setup Java Development Kit (JDK 25)"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: "🐘 Setup Gradle (with Cache Optimization)"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}

      - name: "🔨 Compilation & Local Testing"
        run: ./gradlew clean build --no-daemon --parallel --build-cache

      - name: "🚀 Assert: Paper 26.3 Datapack Boot Verification"
        env:
          MINECRAFT_EULA_ACCEPTED: ${{ vars.MINECRAFT_EULA_ACCEPTED }}
        run: |
          if [ -f scripts/verify-paper-boot.sh ]; then
            bash scripts/verify-paper-boot.sh
          else
            echo "::error:: Critical boot script missing!"
            exit 1
          fi

      - name: "📦 Consolidated Artifact Upload"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "thesift-ci-artifacts"
          path: |
            build/libs/TheSift-foundation-*.jar
            build/reports/tests/
            build/paper-boot-console.log
            run/paper-26.3/logs/latest.log
          if-no-files-found: warn
          retention-days: 7
