plugins {
    id "java"
}

group = "com.gamepathics"
version = "2.0.0-foundation"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def paperApiVersion = providers.gradleProperty("paperApiVersion")
        .orElse("26.3.build.218-stable")

dependencies {
    compileOnly("io.papermc.paper:paper-api:${paperApiVersion.get()}")
    testImplementation("io.papermc.paper:paper-api:${paperApiVersion.get()}")

    // Test dependencies
    testImplementation("org.junit.jupiter:junit-jupiter:5.11.0")
    testImplementation("org.mockito:mockito-core:5.12.0")
    testImplementation("org.mockito:mockito-junit-jupiter:5.12.0")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

processResources {
    filesMatching(["plugin.yml", "paper-plugin.yml"]) {
        expand(version: project.version)
    }
}

jar {
    archiveBaseName = "TheSift-foundation"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
