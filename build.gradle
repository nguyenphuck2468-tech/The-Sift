plugins {
    id "java"
}

group = "com.gamepathics"
version = "2.0.0-foundation"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def paperApiVersion = providers.gradleProperty("paperApiVersion")
        .orElse("26.3.build.218-stable")

dependencies {
    compileOnly("io.papermc.paper:paper-api:${paperApiVersion.get()}")
    testImplementation("io.papermc.paper:paper-api:${paperApiVersion.get()}")

    // Test dependencies
    testImplementation("org.junit.jupiter:junit-jupiter:5.11.0")
    testImplementation("org.mockbukkit.mockbukkit:mockbukkit-v26.3:4.118.0")
    testImplementation("org.mockito:mockito-core:5.24.0")
    testImplementation("org.mockito:mockito-junit-jupiter:5.24.0")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

processResources {
    exclude("bedrock/TheSiftGeyser.jar.embedded")
    exclude("**/*.png")
    filesMatching(["plugin.yml", "paper-plugin.yml"]) {
        expand(version: project.version)
    }
}

jar {
    archiveBaseName = "TheSift-foundation"
}

tasks.register("siftResourcePack", Zip) {
    group = "distribution"
    description = "Builds the Java resource pack for the Sift item and block models."
    archiveFileName = "TheSift-resource-pack.zip"
    destinationDirectory = layout.buildDirectory.dir("distributions")
    from("src/main/resources/pack")
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
