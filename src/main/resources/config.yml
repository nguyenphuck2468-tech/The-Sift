config-version: 4

# Ngôn ngữ thông điệp trong game: vi (mặc định) hoặc en. Ghi đè từng câu
# bằng tệp plugins/TheSift/messages.yml.
locale: vi

content:
  ichor: true
  ichor_bottle: true
  ichor_glass: true
  ichor_glass_pane: true
  # Chưa triển khai: cờ này hiện chỉ xuất hiện trong /sift doctor, chưa điều khiển nội dung.
  # Deprecated legacy toggle: the Sonorous Deepslate provider identity uses the content ID `siftslate`.
  siftslate: true
  sonorous_deepslate: true
  soul_block: true
  charoite: true
  charoite_item: true
  charoite_ore: true
  siftite: true
  siftite_ingot: true
  siftite_ore: true
  siftite_nugget: true
  siftite_upgrade_smithing_template: true
  siftite_sword: true
  siftite_axe: true
  siftite_pickaxe: true
  siftite_shovel: true
  siftite_hoe: true
  # Ngắn hạn: Spear là Netherite Sword stand-in; ném được (spear-reach) nhưng chưa có mô hình projectile riêng.
  siftite_spear: true
  siftite_helmet: true
  siftite_chestplate: true
  siftite_leggings: true
  siftite_boots: true
  # Chưa triển khai: các cờ dưới đây hiện chỉ xuất hiện trong /sift doctor, chưa điều khiển nội dung.
  healthy_sculk: true
  overgrown_willow: true
  resonance: true
  rift-events: true
  singer: true
  echo_golem: true
  # Triển khai một phần: Blub thuần hóa bằng Soul Block + follow/protect đã hoạt động; chưa có GeckoLib animation.
  blub: true
  ichor_bucket: true
  ichor_shard: true
  ichor_snowball: true
  # Triển khai một phần: Sifter spawn theo đàn + drop đã hoạt động; chưa có cơ chế sàng lọc item như mod.
  sifter: true
  # Fan-made, KHÔNG có trong mod gốc (Arta48/Mielons-The-Sift không có "Spire Tyrant" hay
  # Crimson Keep; advancement thesift:tyrant cũng là fan-made). Biến thể boss randomly thay
  # thế The Sifter trong shattered/siftslate peaks. Mặc định TẮT để giữ parity — bật nếu
  # muốn nội dung tự chế này xuất hiện trong spawn.
  spire_tyrant: false
  rift: true
  sift_dimension: true

resonance:
  enabled: true
  singer:
    max-health: 40.0
    range: 16.0
    pulse-seconds: 5
    # The reference mod's Singer is peaceful and invulnerable; it trades Soul Blocks for rewards.
    invulnerable: true
    attack-enabled: false
    damage: 1.0
    slowness-seconds: 3
    slowness-amplifier: 0
    charoite-protection: true
    drop-charoite: true
    # Singer soul event (mod parity): the Singer is invulnerable outside its soul event.
    # Offering a Soul Block (right-click while holding it) opens this window, during which
    # the Singer can be damaged and killed; killing it inside the window grants
    # thesift:singer_silenced. Set to 0 to disable the mechanic (Singer stays killable via
    # resonance.singer.invulnerable: false only).
    soul-event-seconds: 60

echo-golem:
  enabled: true
  # Parity với mod gốc: Echo Golem có 34 máu và KHÔNG tấn công người chơi (trung tính).
  max-health: 34.0
  resonance-period: 8
  resonance-range: 20.0
  # Chưa triển khai: các giá trị resonance/debuff bên dưới chưa được áp dụng trong gameplay.
  resonance-damage: 6.0
  slowness-seconds: 4
  slowness-amplifier: 1
  mining-fatigue-seconds: 6
  mining-fatigue-amplifier: 2
  # Fan-made (KHÔNG có trong mod gốc): nhịp hồi máu cho chủ sở hữu. Mặc định TẮT để giữ
  # parity; bật lên nếu muốn cơ chế cộng hưởng tự chế này hoạt động.
  heal-enabled: false
  heal-amount: 4.0
  # Khi heal-enabled=true, người mang Charoite nhận tầm hồi máu gấp đôi (vẫn giới hạn bán
  # kính, không xuyên toàn thế giới).
  charoite-protection: true
  drop-siftite: true

# Tham chiếu bằng dưới (đọc bởi code với giá trị mặc định nếu thiếu).
mobs:
  blub:
    # Parity với mod gốc: Soul Block luôn bị tiêu hao, thuần hoá Blub với tỉ lệ 1/3 mỗi lần
    # thử chuột phải. Đặt 1.0 để thuần hoá luôn thành công (hành vi cũ).
    tame-chance: 0.3333333333333333

rift:
  enabled: true
  opening-duration-seconds: 5
  active-duration-seconds: 300
  closing-duration-seconds: 5
  mob-spawn-interval-seconds: 60
  initial-mobs: 3
  periodic-mobs: 1
  resonance-pulse-interval-seconds: 60
  resonance-range: 20.0
  reward-drops: 3
  rift-key-chance: 0.3
  # A server-wide recovery period limits free Rift creation through the melody.
  # Ignored: the reference mod has no cooldown between songs.
  portal-song-cooldown-seconds: 0
  # Incomplete melodies expire after this many seconds without a note.
  portal-song-timeout-seconds: 60

ichor:
  enabled: true
  cauldron-material: WATER_CAULDRON
  cauldron:
    max-level: 3
    bottle-cost: 1
    refill-from-source: true
    particles: true
    sounds: true
  bottle-material: GLASS_BOTTLE
  glass-material: GLASS
  glass-pane-material: GLASS_PANE
  snow-material: SNOW
  snow-block-material: SNOW_BLOCK

charoite:
  enabled: true
  world: thesift:the_sift
  # Chưa triển khai: item Charoite hiện dùng vật liệu fallback cố định.
  material: LAPIS_LAZULI
  ore-material: AMETHYST_BLOCK
  drop-min: 1
  drop-max: 2

siftite:
  enabled: true
  # Chưa triển khai: recipe đang dùng vật liệu vanilla cố định.
  ingot-material: NETHERITE_INGOT
  ore-material: ANCIENT_DEBRIS
  # Chưa triển khai: recipe đang dùng vật liệu vanilla cố định.
  nugget-material: IRON_NUGGET
  # Chưa triển khai: recipe đang dùng vật liệu vanilla cố định.
  template-material: NETHERITE_UPGRADE_SMITHING_TEMPLATE
  # Chưa triển khai: hiện không thay đổi loại recipe.
  smithing-only: true
  # Áp dụng khi chế tạo: cộng thêm (multiplier-1)*max durability vào item Siftite mới crafting.
  durability-multiplier: 1.2
  knockback-resistance: 0.1
  weapon-damage-bonus: 1.0
  spear-damage: 9.0
  # Tầm với của cú ném Spear (block); Spear stand-in ném được nhưng chưa có mô hình projectile riêng.
  spear-reach: 4.5
  mining-speed-bonus: 0.2
  mini-rift-recovery: true

compatibility:
  # Deprecated legacy key; runtime target is Paper 26.3. Kept for existing configs.
  minecraft-target: "26.3"

requirements:
  # The Sift depends on provider plugins for real content, but they are SOFT dependencies
  # (paper-plugin.yml declares required: false). Missing providers only log a warning and
  # degrade features; the plugin keeps running. Set hard-stop: true to make the plugin
  # disable itself instead. Tokens are plugin names, or service:item, service:block,
  # service:mob for plugins that register SiftItemProvider/SiftBlockProvider/SiftMobProvider.
  enabled: true
  hard-stop: false
  all-of:
    - ModelEngine
  any-of:
    items: [Nexo, ItemsAdder, Oraxen, "service:item"]
    blocks: [Nexo, ItemsAdder, Oraxen, "service:block"]
    mobs: [MythicMobs, ItemsAdder, EliteMobs, "service:mob"]

providers:
  # true (default): dimension access is denied until every mandatory ID resolves through a
  # provider backend. false: development/CI mode with vanilla fallback placement (logged as a
  # warning at startup). Honouring this flag matches README/docs/TESTING.md.
  strict: true
  bedrock-enabled: false

resource-pack:
  # Gửi resource pack đi kèm plugin cho người chơi khi vào server (qua provider như ResourcePackManager nếu có).
  # Mặc định TẮT: chỉ bật khi đã cấu hình server-url http(s) hợp lệ hoặc cài plugin provider,
  # nếu không client sẽ nhận URL không tải được.
  auto-send: false
  # URL http(s) công khai để client tải zip (bắt buộc cho đường native; file:// bị client từ chối).
  server-url: ""
  title: "The Sift (fan-made)"
  prompt: "Texture mob/blok The Sift"

integrations:
  blocks:
    # Choose one block backend, or auto to discover SiftBlockProvider services then Nexo, ItemsAdder, and Oraxen.
    provider: auto
    # Optional per-ID override. By default each backend resolves the canonical ID (ItemsAdder: thesift:<id>).
    definitions: {}
  items:
    # auto discovers API services, then tries Nexo, ItemsAdder, and Oraxen.
    provider: auto
  mobs:
    # auto discovers API services, then ItemsAdder custom entities, MythicMobs, and mapped EliteMobs bosses.
    provider: auto
    itemsadder:
      # Defaults to thesift:<sift-id>. Override IDs when your IA entity registry uses another key.
      entities: {}
    elitemobs:
      level: 1
      definitions: {}
    modelengine:
      # Map Sift IDs to installed ModelEngine model IDs, for example prism_warden: sift:prism_warden.
      models: {}

sift-world:
  tide-period-seconds: 120
  ichor-weather-period-seconds: 900

# Mod-parity spawn eggs (vanilla stand-in eggs tagged with a Sift content id).
spawn-eggs:
  # When false, right-clicking with a Sift spawn egg is cancelled entirely.
  enabled: true
  # "op" = only operators may use Sift spawn eggs; "all" = any player.
  permission-mode: op

# Crafting/smelting recipes registered by the plugin (charoite, siftite gear, meat smelting,
# ichor glass). With false, the meat food chain still works via the FurnaceSmeltEvent fallback.
recipes:
  enabled: true

debug:
  chunk-generation-metrics:
    enabled: false

ancient-city:
  # Reference-mod portal: a rectangular Reinforced Deepslate frame (min 3x3) with an air-like interior.
  enabled: true
  scan-radius: 40
  row-distance: 6
  # When true, the melody only opens a portal at a frame (as in the mod).
  require-frame: true
