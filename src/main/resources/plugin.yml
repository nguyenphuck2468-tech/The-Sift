name: TheSift
version: '${version}'
main: com.gamepathics.thesift.foundation.TheSiftFoundationPlugin
description: Fan-made The Sift dimension for Paper 26.3; not affiliated with Mojang or Microsoft
author: Gamepathics
api-version: '26.3'
softdepend: [Nexo, ItemsAdder, Oraxen, MythicMobs, EliteMobs, ModelEngine, Geyser-Spigot, floodgate, ViaVersion, ViaBackwards, ViaRewind, ResourcePackManager]

commands:
  sift:
    description: The Sift administration command
    usage: /sift <doctor|reload|give|summon>
    permission: thesift.foundation.admin

permissions:
  thesift.foundation.admin:
    description: Use The Sift foundation administration commands
    default: op
